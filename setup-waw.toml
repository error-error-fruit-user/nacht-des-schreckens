# Nacht des Schreckens: what doomify.py sets up with `tdl setup` once it has rebuilt World at War's
# weapons into nacht-waw/. In nacht's own loadout (see setup.toml), a profile with the library, the
# map and nacht-waw (played as the folder it is, so it is never out of date), first in the list.
# Paths are relative to this folder.
loadout = "published/artifacts/loadout"
remember_loadout = false

[[profiles]]
name = "Nacht des Schreckens"
place = 1
wads = ["published/releases/horde-hammer.pk3", "published/releases/nacht.pk3", "nacht-waw"]
