[package]
name = "nacht-install"
version = "1.0.0"
edition = "2024"
rust-version = "1.99.1"
license = "0BSD"
description = "Installs Nacht des Schreckens and everything it needs, then rebuilds its World at War weapons"

# Its own workspace: this folder is not part of a Rust project otherwise
[workspace]

[dependencies]
clap = { version = "4.5.41", features = ["derive", "wrap_help"] }
sha2 = "0.10"
ureq = "3.4.2"
zip = { version = "2.6.1", default-features = false, features = ["deflate"] }
