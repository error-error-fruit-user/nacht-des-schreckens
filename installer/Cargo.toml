[package]
name = "install-nacht"
version = "1.0.0"
edition = "2024"
rust-version = "1.99.1"
license = "0BSD"
description = "Installs Nacht des Schreckens and everything it needs, then rebuilds its World at War weapons with doomify"

# Its own workspace: this folder is not part of a Rust project otherwise
[workspace]

[dependencies]
# doomify, from the Doomify WaW checkout beside nacht (with hell-hound beside it)
doomify = { path = "../../doomify-waw" }
# the installers' library (the workspace's checkout stands in for it: ../.cargo/config.toml)
installation-groans = { git = "https://github.com/error-error-fruit-user/installation-groans.git" }
toml = { version = "0.8", default-features = false, features = ["parse", "display"] }
ureq = "3.4.2"
zip = { version = "2.6.1", default-features = false, features = ["deflate"] }

[build-dependencies]
anyhow = "1"
doomify = { path = "../../doomify-waw" }
